```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Tam Earn</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#17202a;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.register-box{
    width:100%;
    max-width:430px;
    background:white;
    border:1px solid #e5e8ec;
    border-radius:14px;
    padding:35px 30px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#1769ff;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:28px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d7dce2;
    border-radius:7px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#1769ff;
}

.register-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:7px;
    background:#1769ff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.message{
    margin-top:16px;
    padding:11px;
    border-radius:7px;
    display:none;
    text-align:center;
    font-size:14px;
}

.error{
    background:#fee2e2;
    color:#b91c1c;
}

.success{
    background:#dcfce7;
    color:#15803d;
}

.bottom-text{
    text-align:center;
    margin-top:22px;
    color:#6b7280;
}

.bottom-text a{
    color:#1769ff;
    text-decoration:none;
    font-weight:bold;
}

.home{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#6b7280;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="register-box">

    <div class="logo">Tam Earn</div>

    <p class="subtitle">
        Create your account
    </p>

    <form id="registerForm">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="6"
                required
            >
        </div>

        <button
            type="submit"
            class="register-btn"
            id="registerBtn"
        >
            Create Account
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="bottom-text">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="home">
        ← Back to Home
    </a>

</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    set
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyAQ-FHhexuUfxkcA7zS2iSCLDpAStj3DqI",
    authDomain: "tam-earn.firebaseapp.com",
    projectId: "tam-earn",
    storageBucket: "tam-earn.firebasestorage.app",
    messagingSenderId: "451049191421",
    appId: "1:451049191421:web:b52ece93f962955e420b94",
    measurementId: "G-WPLZVFHDBR"
};


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const database = getDatabase(app);


/* ELEMENTS */

const registerForm =
    document.getElementById("registerForm");

const registerBtn =
    document.getElementById("registerBtn");

const message =
    document.getElementById("message");


/* MESSAGE */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";
}


/* REGISTER */

registerForm.addEventListener("submit",async function(event){

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    registerBtn.disabled = true;

    registerBtn.textContent =
        "Creating Account...";


    try{

        /* CREATE FIREBASE ACCOUNT */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        /* SAVE DISPLAY NAME */

        await updateProfile(user,{
            displayName:name
        });


        /* SAVE USER DATA IN REALTIME DATABASE */

        await set(
            ref(database,"users/" + user.uid),
            {
                uid:user.uid,
                name:name,
                email:email,
                balance:0,
                createdAt:new Date().toISOString(),
                adsDate:new Date().toDateString()
            }
        );


        showMessage(
            "Account created successfully!",
            "success"
        );


        /* OPEN DASHBOARD */

        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },1000);


    }catch(error){

        console.error(error);

        let errorMessage =
            "Unable to create account.";

        if(error.code ===
            "auth/email-already-in-use"){

            errorMessage =
                "This email is already registered.";

        }else if(error.code ===
            "auth/invalid-email"){

            errorMessage =
                "Please enter a valid email.";

        }else if(error.code ===
            "auth/weak-password"){

            errorMessage =
                "Password is too weak.";

        }else if(error.code ===
            "auth/network-request-failed"){

            errorMessage =
                "Network error. Please try again.";

        }


        showMessage(
            errorMessage,
            "error"
        );


        registerBtn.disabled = false;

        registerBtn.textContent =
            "Create Account";
    }

});

</script>

</body>
</html>
```
