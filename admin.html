<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tam Earn - Owner Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#17202a;
}

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#fff;
    padding:35px;
    border-radius:14px;
    border:1px solid #e5e8ec;
}

.logo{
    text-align:center;
    color:#1769ff;
    font-size:28px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d7dce2;
    border-radius:7px;
    margin-bottom:16px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:7px;
    background:#1769ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.message{
    margin-top:15px;
    padding:10px;
    border-radius:7px;
    text-align:center;
    display:none;
}

.error{
    display:block;
    background:#fee2e2;
    color:#b91c1c;
}

.panel{
    display:none;
}

header{
    height:70px;
    background:white;
    border-bottom:1px solid #e5e8ec;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
}

.logo-small{
    color:#1769ff;
    font-size:23px;
    font-weight:bold;
}

.logout{
    width:auto;
    padding:9px 16px;
    background:white;
    color:#dc3545;
    border:1px solid #dc3545;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin:25px 0;
}

.card{
    background:white;
    border:1px solid #e5e8ec;
    border-radius:12px;
    padding:25px;
}

.card p{
    color:#6b7280;
    margin-bottom:8px;
}

.card strong{
    font-size:30px;
}

.table-box{
    background:white;
    border:1px solid #e5e8ec;
    border-radius:12px;
    padding:20px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

th,td{
    padding:13px;
    border-bottom:1px solid #edf0f3;
    text-align:left;
}

th{
    background:#f8fafc;
}

.balance-input{
    width:110px;
    margin:0;
}

.save{
    width:auto;
    padding:8px 12px;
    margin-left:5px;
}

@media(max-width:700px){
    .stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- OWNER LOGIN -->

<div class="login-screen" id="loginScreen">

<div class="login-box">

<div class="logo">Tam Earn</div>

<div class="subtitle">
Owner Admin Login
</div>

<form id="adminLoginForm">

<label>Email</label>

<input
type="email"
id="adminEmail"
placeholder="Owner email"
required
>

<label>Password</label>

<input
type="password"
id="adminPassword"
placeholder="Password"
required
>

<button type="submit">
Admin Login
</button>

</form>

<div id="loginMessage" class="message"></div>

</div>
</div>


<!-- OWNER PANEL -->

<div class="panel" id="adminPanel">

<header>

<div class="logo-small">
Tam Earn Owner
</div>

<button
class="logout"
id="logoutBtn">
Logout
</button>

</header>


<div class="container">

<h1>Owner Admin Panel</h1>

<div class="stats">

<div class="card">
<p>Total Users</p>
<strong id="totalUsers">0</strong>
</div>

<div class="card">
<p>Total Balance</p>
<strong>
Rs. <span id="totalBalance">0</span>
</strong>
</div>

</div>


<div class="table-box">

<table>

<thead>

<tr>
<th>Name</th>
<th>Email</th>
<th>Balance</th>
<th>Created</th>
<th>Action</th>
</tr>

</thead>

<tbody id="usersTable">

<tr>
<td colspan="5">
Loading...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getDatabase,
ref,
onValue,
update
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

apiKey:
"AIzaSyAQ-FHhexuUfxkcA7zS2iSCLDpAStj3DqI",

authDomain:
"tam-earn.firebaseapp.com",

projectId:
"tam-earn",

storageBucket:
"tam-earn.firebasestorage.app",

messagingSenderId:
"451049191421",

appId:
"1:451049191421:web:b52ece93f962955e420b94",

measurementId:
"G-WPLZVFHDBR"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const database =
getDatabase(app);


/* OWNER UID */

const OWNER_UID =
"0u4jneFQu4O93ZilCiURMywdF7Y2";


const loginScreen =
document.getElementById("loginScreen");

const adminPanel =
document.getElementById("adminPanel");

const loginForm =
document.getElementById("adminLoginForm");

const loginMessage =
document.getElementById("loginMessage");

const logoutBtn =
document.getElementById("logoutBtn");


/* SHOW ERROR */

function showError(message){

loginMessage.textContent =
message;

loginMessage.className =
"message error";

}


/* ADMIN LOGIN */

loginForm.addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document.getElementById("adminEmail")
.value.trim();

const password =
document.getElementById("adminPassword")
.value;

try{

const result =
await signInWithEmailAndPassword(
auth,
email,
password
);

if(result.user.uid !== OWNER_UID){

await signOut(auth);

showError(
"Access denied. Owner account required."
);

return;

}

loginScreen.style.display =
"none";

adminPanel.style.display =
"block";

loadUsers();

}catch(error){

showError(
"Invalid Owner email or password."
);

}

});


/* EXISTING LOGIN CHECK */

onAuthStateChanged(
auth,
function(user){

if(user && user.uid === OWNER_UID){

loginScreen.style.display =
"none";

adminPanel.style.display =
"block";

loadUsers();

}

});


/* LOAD USERS */

function loadUsers(){

const usersRef =
ref(database,"users");

onValue(
usersRef,
function(snapshot){

const users =
snapshot.val();

const table =
document.getElementById("usersTable");

table.innerHTML = "";

let count = 0;
let total = 0;

if(!users){

table.innerHTML =
"<tr><td colspan='5'>No users found.</td></tr>";

return;

}

Object.entries(users)
.forEach(
([uid,user])=>{

count++;

const balance =
Number(user.balance || 0);

total += balance;

const row =
document.createElement("tr");

row.innerHTML = `

<td>${escapeHtml(user.name || "-")}</td>

<td>${escapeHtml(user.email || "-")}</td>

<td>
Rs. ${balance.toLocaleString()}
</td>

<td>
${escapeHtml(user.createdAt || "-")}
</td>

<td>

<input
class="balance-input"
type="number"
min="0"
id="balance-${uid}"
value="${balance}"
>

<button
class="save"
data-uid="${uid}">
Save
</button>

</td>
`;

table.appendChild(row);

}
);


document.getElementById(
"totalUsers"
).textContent = count;


document.getElementById(
"totalBalance"
).textContent =
total.toLocaleString();


document
.querySelectorAll(".save")
.forEach(
button=>{

button.addEventListener(
"click",
()=>updateBalance(
button.dataset.uid
)
);

});

});
}


/* UPDATE BALANCE */

async function updateBalance(uid){

const input =
document.getElementById(
"balance-" + uid
);

const balance =
Number(input.value);

if(
Number.isNaN(balance) ||
balance < 0
){

alert("Enter a valid balance.");

return;

}

try{

await update(
ref(database,"users/"+uid),
{
balance:balance
}
);

alert(
"Balance updated successfully."
);

}catch(error){

alert(
"Update failed: " +
error.message
);

}

}


/* ESCAPE HTML */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* LOGOUT */

logoutBtn.addEventListener(
"click",
async function(){

await signOut(auth);

adminPanel.style.display =
"none";

loginScreen.style.display =
"flex";

});

</script>

</body>
</html>
