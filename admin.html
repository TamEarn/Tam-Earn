```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - Tam Earn</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#17202a;
}

header{
    height:70px;
    background:white;
    border-bottom:1px solid #e5e8ec;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#1769ff;
}

.admin-label{
    color:#6b7280;
    margin-right:15px;
}

.logout-btn{
    background:white;
    color:#dc3545;
    border:1px solid #dc3545;
    border-radius:7px;
    padding:9px 15px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

h1{
    margin-bottom:25px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    border:1px solid #e5e8ec;
    border-radius:12px;
    padding:25px;
}

.stat-card p{
    color:#6b7280;
    margin-bottom:8px;
}

.stat-card strong{
    font-size:30px;
}

.table-card{
    background:white;
    border:1px solid #e5e8ec;
    border-radius:12px;
    padding:20px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

th,td{
    padding:14px 12px;
    border-bottom:1px solid #edf0f3;
    text-align:left;
}

th{
    background:#f8fafc;
}

input{
    width:100px;
    padding:8px;
    border:1px solid #d7dce2;
    border-radius:6px;
}

.action-btn{
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    background:#1769ff;
    color:white;
}

.message{
    display:none;
    margin-bottom:20px;
    padding:12px;
    border-radius:7px;
}

.error{
    display:block;
    background:#fee2e2;
    color:#b91c1c;
}

.loading{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr;
    }

    .admin-label{
        display:none;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Tam Earn Admin
    </div>

    <div>
        <span class="admin-label">
            Administrator
        </span>

        <button
            class="logout-btn"
            id="logoutBtn">
            Logout
        </button>
    </div>

</header>


<main class="container">

    <h1>Admin Dashboard</h1>

    <div id="message" class="message"></div>


    <div class="stats">

        <div class="stat-card">
            <p>Total Users</p>
            <strong id="totalUsers">0</strong>
        </div>

        <div class="stat-card">
            <p>Total Balance</p>
            <strong>Rs. <span id="totalBalance">0</span></strong>
        </div>

        <div class="stat-card">
            <p>Firebase Status</p>
            <strong id="firebaseStatus">Connected</strong>
        </div>

    </div>


    <div class="table-card">

        <table>

            <thead>

                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Balance</th>
                    <th>Created</th>
                    <th>Update Balance</th>
                </tr>

            </thead>

            <tbody id="usersTable">

                <tr>
                    <td colspan="5" class="loading">
                        Loading users...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    update
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyAQ-FHhexuUfxkcA7zS2iSCLDpAStj3DqI",

    authDomain:
    "tam-earn.firebaseapp.com",

    projectId:
    "tam-earn",

    storageBucket:
    "tam-earn.firebasestorage.app",

    messagingSenderId:
    "451049191421",

    appId:
    "1:451049191421:web:b52ece93f962955e420b94",

    measurementId:
    "G-WPLZVFHDBR"
};


/* INITIALIZE */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const database =
    getDatabase(app);


/* ELEMENTS */

const usersTable =
    document.getElementById("usersTable");

const totalUsers =
    document.getElementById("totalUsers");

const totalBalance =
    document.getElementById("totalBalance");

const logoutBtn =
    document.getElementById("logoutBtn");


/*
 IMPORTANT:
 This page currently checks that an authenticated
 Firebase user is logged in.

 For production, admin authorization must be added
 through Firebase security rules / custom claims.
*/


/* AUTH CHECK */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.href =
                "login.html";

            return;
        }

        loadUsers();

    }
);


/* LOAD USERS */

function loadUsers(){

    const usersRef =
        ref(database,"users");


    onValue(
        usersRef,
        function(snapshot){

            const users =
                snapshot.val();

            usersTable.innerHTML = "";


            if(!users){

                usersTable.innerHTML =
                    `<tr>
                        <td colspan="5" class="loading">
                            No users found.
                        </td>
                    </tr>`;

                totalUsers.textContent =
                    "0";

                totalBalance.textContent =
                    "0";

                return;
            }


            const userList =
                Object.entries(users);


            totalUsers.textContent =
                userList.length;


            let balanceTotal = 0;


            userList.forEach(
                function([uid,user]){

                    const balance =
                        Number(user.balance || 0);

                    balanceTotal += balance;


                    const tr =
                        document.createElement("tr");


                    const name =
                        user.name || "Unknown";

                    const email =
                        user.email || "-";

                    const created =
                        user.createdAt || "-";


                    tr.innerHTML = `

                        <td>
                            ${escapeHtml(name)}
                        </td>

                        <td>
                            ${escapeHtml(email)}
                        </td>

                        <td>
                            Rs. ${balance.toLocaleString()}
                        </td>

                        <td>
                            ${escapeHtml(created)}
                        </td>

                        <td>

                            <input
                                type="number"
                                min="0"
                                id="balance-${uid}"
                                value="${balance}"
                            >

                            <button
                                class="action-btn"
                                data-uid="${uid}">
                                Save
                            </button>

                        </td>
                    `;


                    usersTable.appendChild(tr);

                }
            );


            totalBalance.textContent =
                balanceTotal.toLocaleString();


            document
                .querySelectorAll(".action-btn")
                .forEach(
                    function(button){

                        button.addEventListener(
                            "click",
                            function(){

                                updateUserBalance(
                                    button.dataset.uid
                                );

                            }
                        );

                    }
                );

        },
        function(error){

            console.error(error);

            showError(
                "Unable to load users: " +
                error.message
            );

        }
    );

}


/* UPDATE BALANCE */

async function updateUserBalance(uid){

    const input =
        document.getElementById(
            "balance-" + uid
        );


    if(!input){
        return;
    }


    const newBalance =
        Number(input.value);


    if(
        Number.isNaN(newBalance) ||
        newBalance < 0
    ){

        alert(
            "Please enter a valid balance."
        );

        return;
    }


    try{

        await update(
            ref(
                database,
                "users/" + uid
            ),
            {
                balance:newBalance
            }
        );


        alert(
            "Balance updated successfully."
        );

    }catch(error){

        console.error(error);

        alert(
            "Unable to update balance: " +
            error.message
        );

    }

}


/* HTML ESCAPE */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ERROR */

function showError(text){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message error";
}


/* LOGOUT */

logoutBtn.addEventListener(
    "click",
    async function(){

        try{

            await signOut(auth);

            window.location.href =
                "login.html";

        }catch(error){

            console.error(error);

            alert(
                "Logout failed."
            );

        }

    }
);

</script>

</body>
</html>
